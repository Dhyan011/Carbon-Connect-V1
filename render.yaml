# Render Blueprint: https://render.com/docs/blueprint-spec
# Replace the example service URLs in CORS_ORIGINS/VITE_API_BASE_URL if you rename either service.
services:
  - type: web
    name: carbon-connect-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carbon-connect-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://carbon-connect-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: carbon-connect-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://carbon-connect-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: carbon-connect-db
    databaseName: carbon_connect
    user: carbon_connect
